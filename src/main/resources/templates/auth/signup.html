<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - TestBoard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .register-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            background-color: white;
        }
        .form-floating {
            margin-bottom: 1rem;
        }
        .btn-register {
            width: 100%;
            padding: 10px;
        }
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .error-message {
            color: #dc3545;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="register-container">
            <div class="register-header">
                <h1>회원가입</h1>
                <p class="text-muted">TestBoard의 회원이 되어주세요</p>
            </div>
            
            <!-- 에러 메시지 표시 -->
            <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}">
            </div>
            
            <form th:action="@{/auth/signup}" method="post">
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" name="email" required>
                    <label for="email">이메일</label>
                </div>
                
                <div class="form-floating">
                    <input type="text" class="form-control" id="username" name="username" required>
                    <label for="username">아이디</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" name="password" required>
                    <label for="password">비밀번호</label>
                </div>
                
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                    <label for="confirmPassword">비밀번호 확인</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-register">회원가입</button>
            </form>
            
            <div class="text-center mt-3">
                <p>이미 계정이 있으신가요? <a th:href="@{/auth/login}">로그인</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
