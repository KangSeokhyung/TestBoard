<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - TestBoard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            background-color: white;
        }
        .form-floating {
            margin-bottom: 1rem;
        }
        .btn-login {
            width: 100%;
            padding: 10px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .error-message {
            color: #dc3545;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <h1>TestBoard</h1>
                <p class="text-muted">로그인하여 시작하세요</p>
            </div>
            
            <!-- 에러 메시지 표시 -->
            <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </div>
            
            <!-- 성공 메시지 표시 -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">
            </div>
            
            <form th:action="@{/auth/login}" method="post">
                <div class="form-floating">
                    <input type="text" class="form-control" id="username" name="username" required>
                    <label for="username">아이디</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" name="password" required>
                    <label for="password">비밀번호</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login">로그인</button>
            </form>
            
            <div class="text-center mt-3">
                <p>계정이 없으신가요? <a th:href="@{/auth/signup}">회원가입</a></p>
                <a th:href="@{/}" class="btn btn-link">메인으로 돌아가기</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
